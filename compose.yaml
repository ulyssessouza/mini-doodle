services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doodle -d doodle"]
      interval: 5s
      timeout: 5s
      retries: 12
